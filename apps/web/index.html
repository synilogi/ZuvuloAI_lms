<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6fa" />
    <meta name="application-name" content="ZuviloAI" />
    <meta name="apple-mobile-web-app-title" content="ZuviloAI" />
    <!-- The built-in ZuviloAI icons. The two under /src are bundled, so each build names them by their content and an
         old one is never served from cache. `data-brand-icon` lets the app point them at a favicon the Super Admin
         saved (src/branding/BrandingProvider.tsx). /favicon.ico is what a browser asks for when given no link. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" data-brand-icon />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/brand/favicon-32.png" data-brand-icon />
    <link rel="apple-touch-icon" href="/src/assets/brand/apple-touch-icon.png" data-brand-icon />
    <link rel="manifest" href="/site.webmanifest" />
    <title>ZuviloAI — Online courses with verifiable certificates</title>
    <meta
      name="description"
      content="Online courses with lessons, live classes, tests and certificates anyone can verify. See the outline, the instructor and the price before you sign up."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZuviloAI" />
    <meta property="og:title" content="ZuviloAI — Online courses with verifiable certificates" />
    <meta
      property="og:description"
      content="Online courses with lessons, live classes, tests and certificates anyone can verify. See the outline, the instructor and the price before you sign up."
    />
    <meta property="og:url" content="https://zuviloai.com/" />
    <meta property="og:image" content="https://zuviloai.com/icon-512.png" />
    <meta name="twitter:card" content="summary" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

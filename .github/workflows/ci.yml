# Every push and pull request: formatting, lint, types, all unit tests, and the browser tests against the compiled API.
# The server's poll-deploy.sh ships a commit only once the `checks` job here has passed on it.
name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/zuviloai_test
      E2E_DATABASE_URL: mysql://root:root@127.0.0.1:3306/zuviloai_e2e
      E2E_API_BUNDLE: '1'
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/zuviloai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        working-directory: apps/api
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test --workspaces --if-present
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: apps/web/test-results
          if-no-files-found: ignore
